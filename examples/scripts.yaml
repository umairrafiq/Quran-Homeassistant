# Add these scripts to your scripts.yaml or via UI
# Settings → Automations & Scenes → Scripts → Create Script

# Script to play the daily ayah with Arabic + Translation
play_daily_ayah:
  alias: Play Daily Ayah
  icon: mdi:book-open-page-variant
  description: Play today's Quran ayah with Arabic recitation and translation
  sequence:
    # Announce the surah name first
    - action: tts.speak
      target:
        entity_id: tts.piper  # Change to your TTS entity
      data:
        cache: true
        media_player_entity_id: media_player.living_room  # Change to your speaker
        message: >-
          Ayah of the day from Surah {{ state_attr('sensor.quran_daily_ayah', 'surah_name') }}, 
          verse {{ state_attr('sensor.quran_daily_ayah', 'ayah_in_surah') }}
    - delay:
        seconds: 4
    # Play Arabic recitation
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room  # Change to your speaker
      data:
        media_content_type: music
        media_content_id: "{{ states('sensor.quran_daily_ayah_audio') }}"
    - delay:
        seconds: 15  # Adjust based on typical ayah length
    # Speak the translation
    - action: tts.speak
      target:
        entity_id: tts.piper  # Change to your TTS entity
      data:
        cache: true
        media_player_entity_id: media_player.living_room  # Change to your speaker
        message: "{{ state_attr('sensor.quran_daily_ayah', 'full_text') }}"
  mode: single

# Simple version - Arabic audio only (no TTS needed)
play_daily_ayah_simple:
  alias: Play Daily Ayah (Audio Only)
  icon: mdi:book-open-page-variant
  sequence:
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room  # Change to your speaker
      data:
        media_content_type: music
        media_content_id: "{{ states('sensor.quran_daily_ayah_audio') }}"
  mode: single

# Script to play any surah
play_quran_surah:
  alias: Play Quran Surah
  icon: mdi:book-open-variant
  fields:
    surah:
      description: Surah number (1-114)
      example: 55
      selector:
        number:
          min: 1
          max: 114
    media_player:
      description: Media player to use
      example: media_player.living_room
      selector:
        entity:
          domain: media_player
  sequence:
    - action: quran.play_surah
      data:
        surah: "{{ surah }}"
        media_player: "{{ media_player }}"
  mode: single
